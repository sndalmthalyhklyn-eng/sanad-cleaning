<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>إطلاق أحداث TikTok</title>
<!-- نفس بكسل الموقع بالضبط -->
<script>
!function(w,d,t){
  w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];
  ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],
  ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};
  for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);
  ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e};
  ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js";
    ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};
    var s=document.createElement("script");s.type="text/javascript",s.async=!0,s.src=r+"?sdkid="+e+"&lib="+t;
    var a=document.getElementsByTagName("script")[0];a.parentNode.insertBefore(s,a)};

</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Tajawal,Arial,sans-serif;background:#0f1923;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .wrap{width:100%;max-width:420px;text-align:center}
  h2{font-size:1.3rem;margin-bottom:8px;color:#25d366}
  p{font-size:.85rem;color:#aaa;margin-bottom:24px}
  .counter{font-size:3.5rem;font-weight:900;color:#fff;margin-bottom:6px;line-height:1}
  .label{font-size:.9rem;color:#aaa;margin-bottom:28px}
  .bar-wrap{background:#1e2d38;border-radius:50px;height:14px;overflow:hidden;margin-bottom:28px}
  .bar{height:100%;background:linear-gradient(90deg,#25d366,#1a9e4d);border-radius:50px;width:0%;transition:width .4s ease}
  .log{background:#1e2d38;border-radius:14px;padding:14px;max-height:260px;overflow-y:auto;text-align:right;margin-bottom:20px}
  .log-item{padding:6px 8px;border-bottom:1px solid #2a3d4a;font-size:.8rem;display:flex;align-items:center;gap:8px}
  .log-item:last-child{border:none}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.ok{background:#25d366}
  .dot.wait{background:#f0c419}
  .btn-start{background:linear-gradient(135deg,#25d366,#1a9e4d);color:#fff;border:none;border-radius:14px;padding:14px 32px;font-size:1rem;font-weight:800;font-family:inherit;cursor:pointer;width:100%;margin-bottom:10px}
  .btn-start:disabled{opacity:.5;cursor:not-allowed}
  .done-msg{display:none;background:linear-gradient(135deg,#1a6e3c,#27a85e);border-radius:14px;padding:16px;font-size:.95rem;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <h2>🎯 إطلاق أحداث Contact</h2>
  <p>سيُرسل <b>20 حدث Contact</b> إلى TikTok Pixel تلقائياً</p>

  <div class="counter" id="cnt">0</div>
  <div class="label">من أصل 20 حدث</div>
  <div class="bar-wrap"><div class="bar" id="bar"></div></div>

  <div class="log" id="log">
    <div class="log-item"><span class="dot wait"></span>في انتظار البدء…</div>
  </div>

  <button class="btn-start" id="btn" onclick="startFiring()">▶ ابدأ إطلاق الأحداث</button>
  <div class="done-msg" id="done">✅ تم إرسال 20 حدث Contact إلى TikTok!<br/>افتح Events Manager وستجد الأعداد محدَّثة.</div>
</div>

<script>
var total = 20;
var fired = 0;
var running = false;

var types = [
  "page_load","call_click","whatsapp_click","call_click","page_load",
  "whatsapp_click","call_click","call_click","whatsapp_click","page_load",
  "call_click","whatsapp_click","call_click","page_load","whatsapp_click",
  "call_click","call_click","page_load","whatsapp_click","call_click"
];

function uid(){
  return (window.crypto && window.crypto.randomUUID)
    ? window.crypto.randomUUID()
    : "ev_"+Date.now()+"_"+Math.random().toString(36).slice(2,10);
}

function addLog(msg, ok){
  var log = document.getElementById("log");
  if(fired === 1) log.innerHTML = "";
  var item = document.createElement("div");
  item.className = "log-item";
  item.innerHTML = '<span class="dot '+(ok?"ok":"wait")+'"></span><span>'+msg+'</span>';
  log.appendChild(item);
  log.scrollTop = log.scrollHeight;
}

function fireOne(){
  if(fired >= total){ finish(); return; }
  var label = types[fired];
  var eventId = uid();
  try{
    window.ttq.track("Contact",
      {description: label, contact_method: label.indexOf("whatsapp")>=0?"whatsapp":"phone"},
      {event_id: eventId}
    );
    fired++;
    document.getElementById("cnt").textContent = fired;
    document.getElementById("bar").style.width = (fired/total*100)+"%";
    addLog("["+fired+"/"+total+"] Contact → "+label, true);
    setTimeout(fireOne, 1200);
  } catch(e){
    addLog("خطأ: "+e.message, false);
  }
}

function startFiring(){
  if(running) return;
  running = true;
  document.getElementById("btn").disabled = true;
  document.getElementById("btn").textContent = "⏳ جارٍ الإرسال…";
  document.getElementById("log").innerHTML = "";

  // انتظر تحميل الـ Pixel أولاً
  var wait = 0;
  var check = setInterval(function(){
    wait++;
    if((window.ttq && typeof window.ttq.track==="function") || wait>15){
      clearInterval(check);
      addLog("✅ Pixel محمّل — بدء الإرسال", true);
      setTimeout(fireOne, 500);
    } else {
      addLog("⏳ انتظار تحميل Pixel… ("+wait+")", false);
    }
  }, 500);
}

function finish(){
  document.getElementById("btn").textContent = "✅ اكتمل";
  document.getElementById("done").style.display = "block";
  addLog("🎉 اكتمل! 20 حدث أُرسلوا.", true);
}

// إطلاق تلقائي بعد ثانيتين من فتح الصفحة
setTimeout(function(){
  var btn = document.getElementById("btn");
  if(!running){ btn.textContent="▶ إطلاق تلقائي خلال 3…"; }
  setTimeout(function(){
    if(!running){ btn.textContent="▶ إطلاق تلقائي خلال 2…"; }
    setTimeout(function(){
      if(!running){ btn.textContent="▶ إطلاق تلقائي خلال 1…"; }
      setTimeout(function(){ if(!running) startFiring(); }, 1000);
    }, 1000);
  }, 1000);
}, 2000);
</script>
</body>
</html>
